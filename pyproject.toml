[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arka"
version = "0.1.0"
description = "Autonomous Resource & Knowledge Agent - A RAG-based AI Agent CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ARKA Team"}
]
keywords = ["ai", "agent", "rag", "llm", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
memory = [
    "mem0ai>=0.1.0",
    "chromadb>=0.4.0",
    "llama-index>=0.10.0",
]
browser = [
    "browser-use>=0.1.0",
    "playwright>=1.40.0",
]
training = [
    "agentlightning>=0.1.0",
]
all = [
    "arka[memory,browser,training]",
]

[project.scripts]
arka = "arka.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/arka"
Documentation = "https://github.com/yourusername/arka#readme"
Repository = "https://github.com/yourusername/arka"

[tool.setuptools.packages.find]
where = ["."]
include = ["arka*"]
