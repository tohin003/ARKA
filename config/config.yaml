# ARKA Configuration
# Copy to ~/.arka/config.yaml or edit config/config.yaml

# Model Registry (OpenAI Only)
models:
  # Default model for Main Agent / Orchestrator
  default: gpt-5.2             # Better reasoning for all tasks
  
  # Sub-agent model assignments (all OpenAI)
  planner: gpt-5.2             # Better general planning (user preference)
  coder: gpt-5.2-codex         # Best for coding tasks
  tester: gpt-5.2              # Better reasoning for tests
  debugger: gpt-5.2-codex      # Strong coding model for debugging
  memory_manager: gpt-5.2      # Better context understanding
  
  # Form Filling Pipeline
  gui_vision: gpt-5.2          # Vision + thinking for form extraction
  gui_reasoner: o1             # Deep reasoning for confusion/review

# OpenAI Configuration
openai:
  api_key: ${OPENAI_API_KEY}  # Set via environment variable
  available_models:
    - gpt-4o
    - gpt-4o-mini
    - gpt-4.1
    - gpt-4.1-mini
    - gpt-5
    - gpt-5-mini
    - gpt-5-codex
    - gpt-5.1
    - gpt-5.1-codex
    - gpt-5.2
    - gpt-5.2-codex
    - gpt-5.2-pro
    - o1
    - o1-pro
    - o3
    - o3-mini
    - o3-pro

# Budget & Cost Control (Important for API-only usage)
budget:
  daily_limit: 10.00          # USD per day
  session_limit: 3.00         # USD per session
  warning_threshold: 0.80     # Warn when 80% consumed

# Token Tracking
tokens:
  context_limit:
    gpt-4o: 128000
    gpt-4o-mini: 128000
    o1-preview: 128000
    o1-mini: 128000

# Resource Monitoring
resources:
  cpu_pause_threshold: 90     # Pause tasks if CPU > 90%
  ram_pause_threshold: 85     # Pause tasks if RAM > 85%
  check_interval: 5           # Seconds between checks

# Memory Configuration
memory:
  vector_db: chromadb
  chroma_path: ./data/chroma
  mem0_enabled: true

# MCP Configuration
mcp:
  servers: []                 # Add MCP server URLs here

# Skills Configuration
skills:
  path: ./arka/skills/trained
  auto_learn: true

# Logging
logging:
  level: INFO
  file: ./logs/arka.log
  structured: true            # JSON logging for audit trail

# GUI Agent Configuration
gui:
  checkpoint_interval: 5      # Reflect every 5 steps
  max_checkpoints: 10         # Max check points per task
  confidence_threshold: 0.8   # Skip o1 if confidence > threshold
  reflection_timeout: 60      # Seconds for o1 reflection

# Learning Configuration
learning:
  store_checkpoints: true     # Store o1 feedback
  store_user_feedback: true   # Store /good /bad feedback
